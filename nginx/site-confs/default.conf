server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 443 quic reuseport default_server;
    listen [::]:443 quic reuseport default_server;

    server_name _;
    include /config/nginx/ssl.conf;

    root /config/public;
    index index.php;
    absolute_redirect off;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        # Revalidate direct or nested CSS/font/image requests instead of
        # reusing stale cached copies. Nginx still supports ETag/304 responses.
        expires -1;
    }

    location ^~ /views/ {
        return 404;
    }

    location = /index.php {
        include /etc/nginx/fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ \.php(?:/|$) {
        rewrite ^ /index.php last;
    }

    location ~ /\. {
        deny all;
    }
}
