user abc;
include /config/nginx/worker_processes.conf;
pcre_jit on;
error_log /config/log/nginx/error.log;

include /etc/nginx/modules/*.conf;
include /etc/nginx/conf.d/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    include /config/nginx/resolver.conf;
    server_tokens off;
    client_max_body_size 0;
    sendfile on;
    tcp_nopush on;
    gzip_vary on;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map $http_user_agent $suspicious_user_agent {
        default 1;
        ~*(python|curl|wget|httpie|httpx|requests|urllib|aiohttp|scrapy|selenium|playwright|puppeteer|headless|phantomjs|postman|insomnia|axios|node-fetch|undici|go-http-client|okhttp|java|libwww|perl|ruby|php|bot|spider|crawler|scanner|nikto|sqlmap|nmap|zgrab|masscan) 1;
        ~*^Mozilla/5\.0.*(Chrome|Chromium|Firefox|Safari|Edg|OPR|Opera|CriOS|FxiOS|SamsungBrowser|UCBrowser|Vivaldi|YaBrowser)/[0-9] 0;
    }
    map $suspicious_user_agent $browser_user_agent {
        0 1;
        default 0;
    }
    http2 on;
    http3 on;
    quic_retry on;
    access_log /config/log/nginx/access.log combined if=$browser_user_agent;
    access_log /config/log/suspicious-activity.log combined if=$suspicious_user_agent;
    client_body_temp_path /tmp/nginx 1 2;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    proxy_cache_path /tmp/nginx-proxy-cache keys_zone=lsio-proxy:10m;
    fastcgi_cache_path /tmp/nginx-fcgi-cache keys_zone=lsio-fcgi:10m;
    scgi_cache_path /tmp/nginx-scgi-cache keys_zone=lsio-scgi:10m;
    uwsgi_cache_path /tmp/nginx-uwsgi-cache keys_zone=lsio-uwsgi:10m;
    include /etc/nginx/http.d/*.conf;
    include /config/nginx/site-confs/*.conf;
}
daemon off;
pid /run/nginx.pid;
